name: Update docs

on:
  # 05:17 UTC — off the hour, because scheduled jobs on the hour queue behind everyone else's.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-docs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # update.ts has no dependencies; Node runs it directly via native type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Fails the job if the guardrail trips (upstream unreachable, a file that is not the
      # format it claims, or a >10% drop in file count). Nothing is written in that case, so
      # the mirror goes stale loudly rather than deleting itself quietly.
      - name: Sync mirror
        id: sync
        run: node update.ts

      - name: Commit
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs INDEX.md .metadata.json
          git commit -m "docs: sync $(date -u +%F) (${{ steps.sync.outputs.summary }})"
          git push
